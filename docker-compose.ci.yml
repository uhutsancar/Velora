# CI dogrulamasi icin ek katman.
#
# docker-compose.prod.yml yonetim uclarini bilerek disari acmaz. Ancak
# scripts/verify-eventbus.py kuyruk topolojisini ve tuketici sayaclarini
# RabbitMQ yonetim API'sinden okur, dolayisiyla CI kosucusundan erisilebilir
# olmalidir. Bu dosya yalnizca o portu yayinlar; prod dosyasi degismez.
#
# Kullanim:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d
services:
  rabbitmq:
    ports:
      - '15672:15672'

  identity:
    environment:
      # Uctan uca dogrulama iki tam senaryo kosuyor ve her biri kayit, giris,
      # yanlis parola denemesi ve token yenileme yapiyor. Dakikada on istekle
      # ikinci script duzenli olarak 429 aliyor - uygulamada bir sorun yokken.
      # Brute force korumasi prod'da oldugu gibi kaliyor, yalnizca CI gevsiyor.
      RateLimit__Auth__PermitLimit: '1000'
      RateLimit__Auth__WindowSeconds: '60'
