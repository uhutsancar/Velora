# ============================================================================
#  Velora - production stack
#
#  Everything that differs between environments comes from .env (see
#  .env.example). No secret is written in this file and none is baked into an
#  image; the services read them from the environment at start-up and refuse to
#  boot if a required one is missing.
#
#      cp .env.example .env      # then fill it in
#      docker compose -f docker-compose.prod.yml build
#      docker compose -f docker-compose.prod.yml up -d
#
#  Local development does NOT use this file - it runs
#  docker-compose.infrastructure.yml plus scripts/run-backend.ps1, so hot reload
#  and the debugger keep working.
#
#  Note on the data services below: SQL Server, Redis and RabbitMQ are included
#  so the stack is self-contained. In a real deployment prefer managed
#  equivalents (Azure SQL, Azure Cache for Redis, Azure Service Bus) and point
#  the connection settings at them instead - the services do not care which.
# ============================================================================

name: velora

x-dotnet-common: &dotnet-common
  restart: unless-stopped
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: 8080
    # Every service validates this at start-up; a blank value stops the boot.
    AuthConfig__Secret: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY is required}
    EventBus__Type: ${EVENTBUS_TYPE:-RabbitMQ}
    EventBus__HostName: rabbitmq
    EventBus__Port: 5672
    EventBus__UserName: ${RABBITMQ_USER:?RABBITMQ_USER is required}
    EventBus__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ConsulConfig__Address: http://consul:8500
    Cors__AllowedOrigins__0: ${STOREFRONT_ORIGIN:?STOREFRONT_ORIGIN is required}
    Cors__AllowedOrigins__1: ${ADMIN_ORIGIN:?ADMIN_ORIGIN is required}
  networks: [velora]

services:
  # ---------------------------------------------------------------- data ----
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required}
      MSSQL_PID: Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [velora]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD is required}', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD}', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [velora]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [velora]

  consul:
    image: hashicorp/consul:latest
    restart: unless-stopped
    command: 'agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0'
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [velora]

  # ------------------------------------------------------------ services ----
  identity:
    <<: *dotnet-common
    build:
      context: .
      dockerfile: SellingBuddy/src/Services/IdentityService/IdentityService.Api/Dockerfile
    image: velora/identity:${VELORA_TAG:-latest}
    environment:
      <<: *dotnet-env
      ConnectionStrings__IdentityConnection: Server=sqlserver,1433;Database=velora_identity;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      ConsulConfig__ServiceHost: identity
      ConsulConfig__HealthCheckHost: identity
      # Leave blank to skip creating a bootstrap admin; the service then logs a warning.
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      sqlserver: {condition: service_healthy}
      consul: {condition: service_healthy}

  catalog:
    <<: *dotnet-common
    build:
      context: .
      dockerfile: SellingBuddy/src/Services/CatalogService/CatalogService.Api/Dockerfile
    image: velora/catalog:${VELORA_TAG:-latest}
    environment:
      <<: *dotnet-env
      ConnectionStrings__CatalogConnection: Server=sqlserver,1433;Database=velora_catalog;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      ConsulConfig__ServiceHost: catalog
      ConsulConfig__HealthCheckHost: catalog
    volumes:
      # Uploaded product media has to outlive the container.
      - catalog-media:/app/wwwroot/media
    depends_on:
      sqlserver: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      consul: {condition: service_healthy}

  basket:
    <<: *dotnet-common
    build:
      context: .
      dockerfile: SellingBuddy/src/Services/BasketService/BasketService.Api/Dockerfile
    image: velora/basket:${VELORA_TAG:-latest}
    environment:
      <<: *dotnet-env
      RedisSettings__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      ConsulConfig__ServiceHost: basket
      ConsulConfig__HealthCheckHost: basket
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      consul: {condition: service_healthy}

  order:
    <<: *dotnet-common
    build:
      context: .
      dockerfile: SellingBuddy/src/Services/OrderService/OrderService.Api/Dockerfile
    image: velora/order:${VELORA_TAG:-latest}
    environment:
      <<: *dotnet-env
      OrderDbConnectionString: Server=sqlserver,1433;Database=velora_order;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;
      ConsulConfig__ServiceHost: order
      ConsulConfig__HealthCheckHost: order
    depends_on:
      sqlserver: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      consul: {condition: service_healthy}

  payment:
    <<: *dotnet-common
    build:
      context: .
      dockerfile: SellingBuddy/src/Services/PaymentService/PaymentService.Api/Dockerfile
    image: velora/payment:${VELORA_TAG:-latest}
    environment:
      <<: *dotnet-env
      # Stand-in for a real PSP: flips every authorisation to success or failure.
      PaymentSuccess: ${PAYMENT_SUCCESS:-true}
    depends_on:
      rabbitmq: {condition: service_healthy}

  notification:
    <<: *dotnet-common
    build:
      context: .
      dockerfile: SellingBuddy/src/Services/NotificationService/NotificationService/Dockerfile
    image: velora/notification:${VELORA_TAG:-latest}
    environment:
      <<: *dotnet-env
      DOTNET_ENVIRONMENT: Production
    depends_on:
      rabbitmq: {condition: service_healthy}

  gateway:
    <<: *dotnet-common
    build:
      context: .
      dockerfile: SellingBuddy/src/ApiGateways/WebApiGateway/Web.ApiGateway/Dockerfile
    image: velora/gateway:${VELORA_TAG:-latest}
    environment:
      <<: *dotnet-env
      GlobalConfiguration__BaseUrl: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      GlobalConfiguration__ServiceDiscoveryProvider__Host: consul
      GlobalConfiguration__ServiceDiscoveryProvider__Port: 8500
    ports:
      - '${GATEWAY_PORT:-5000}:8080'
    depends_on:
      consul: {condition: service_healthy}
      identity: {condition: service_started}
      catalog: {condition: service_started}
      basket: {condition: service_started}
      order: {condition: service_started}

  # ----------------------------------------------------------- frontends ----
  # Vite inlines VITE_* at build time, so these are build args. Changing an
  # origin means rebuilding the image, not restarting the container.
  storefront:
    restart: unless-stopped
    build:
      context: .
      dockerfile: velora/apps/storefront/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL}
        VITE_MEDIA_ORIGIN: ${MEDIA_PUBLIC_URL:-${API_PUBLIC_URL}}
        VITE_SITE_URL: ${STOREFRONT_ORIGIN}
        VITE_SITE_NAME: ${SITE_NAME:-Velora}
        VITE_CURRENCY: ${CURRENCY:-TRY}
    image: velora/storefront:${VELORA_TAG:-latest}
    ports:
      - '${STOREFRONT_PORT:-8080}:80'
    depends_on: [gateway]
    networks: [velora]

  admin:
    restart: unless-stopped
    build:
      context: .
      dockerfile: velora/apps/admin/Dockerfile
      args:
        VITE_API_URL: ${API_PUBLIC_URL}
        VITE_MEDIA_ORIGIN: ${MEDIA_PUBLIC_URL:-${API_PUBLIC_URL}}
        VITE_STOREFRONT_URL: ${STOREFRONT_ORIGIN}
        VITE_APP_NAME: ${ADMIN_APP_NAME:-Velora Admin}
        VITE_CURRENCY: ${CURRENCY:-TRY}
    image: velora/admin:${VELORA_TAG:-latest}
    ports:
      - '${ADMIN_PORT:-8081}:80'
    depends_on: [gateway]
    networks: [velora]

networks:
  velora:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
  consul-data:
  catalog-media:
