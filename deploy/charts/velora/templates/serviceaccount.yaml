{{/* Her servise ayri kimlik: varsayilan SA paylasilmaz, boylece bir servisin
     yetkisi digerine sizmaz. */}}
{{- range $slug, $svc := .Values.services }}
{{- $ctx := dict "slug" $slug "svc" $svc "root" $ }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "velora.fullname" $ctx }}
  labels: {{- include "velora.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
