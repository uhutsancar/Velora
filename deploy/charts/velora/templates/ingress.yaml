{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-public
  labels:
    app.kubernetes.io/part-of: velora
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Varsayilan 1 MB'dir; MediaController 5 MB'a izin verdigi icin gorsel
    # yuklemeleri aksi halde ingress'te 413 alir.
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecret }}
      hosts:
        {{- range $name, $host := .Values.ingress.hosts }}
        - {{ $host.host | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $name, $host := .Values.ingress.hosts }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $host.service }}
                port:
                  number: {{ $.Values.containerPort }}
    {{- end }}
{{- end }}
