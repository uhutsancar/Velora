# Yerel Kubernetes icin veri katmani (Docker Desktop).
#
# Prod'da SQL/Redis/RabbitMQ kume DISINDA, yonetilen servisler olarak calisir
# (ADR-04): kumede stateful veri isletmek bu olcekte kazanctan cok maliyettir.
# Bu dosya YALNIZCA yerel deneme icindir; tek replika, kalicilik yok, kaynak
# talepleri kucuk. Bu yuzden charts/ altinda degil, ayri duruyor.
#
# Service adlari (sql / redis / rabbitmq) uygulamanin bekledigi isimlerle birebir
# aynidir; boylece baglanti dizeleri ortamlar arasinda degismez.
apiVersion: v1
kind: Namespace
metadata:
  name: velora-local
  labels:
    # Prod'da "restricted" uygulanir; SQL Server imaji yerelde daha genis
    # izinlerle calistigi icin burada yalnizca uyari verilir.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql
  namespace: velora-local
  labels: { app.kubernetes.io/name: sql, app.kubernetes.io/component: data }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sql, app.kubernetes.io/component: data }
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports: [{ containerPort: 1433, name: sql }]
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            # SQL Server varsayilan olarak makinenin tum bellegini sahiplenmeye
            # calisir. Tek nodelu bir Docker Desktop kumesinde bu, RabbitMQ'yu
            # bellek alarmina sokup hazir olmasini engelliyor.
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: velora-data-secrets, key: SQL_SA_PASSWORD }
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 2560Mi }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sql
  namespace: velora-local
spec:
  selector: { app.kubernetes.io/name: sql }
  ports: [{ port: 1433, targetPort: sql }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: velora-local
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: data }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: data }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Parola argv'de gorunmesin diye ortam degiskeninden okunur.
          command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: velora-data-secrets, key: REDIS_PASSWORD }
          ports: [{ containerPort: 6379, name: redis }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: velora-local
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: velora-local
  labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: data }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: rabbitmq }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rabbitmq, app.kubernetes.io/component: data }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: management }
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: velora-data-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: velora-data-secrets, key: RABBITMQ_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            # rabbitmq-diagnostics bir Erlang dugumu baslatir; kisitli bir VM'de
            # bu saniyeler surer ve varsayilan 1 sn'lik timeout'a sigmaz.
            # Broker'in kendisi saglikli oldugu halde prob basarisiz gorunur.
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: velora-local
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
