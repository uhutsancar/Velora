name: PR Validate

on:
  pull_request:
    branches: [main]

# Ayni PR'a yeni commit gelince eski kosuyu iptal et: runner dakikasi bosa gitmesin.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # Neyin degistigini bir kez hesapla; asagidaki isler buna gore atlanir.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'SellingBuddy/**'
              - 'SellingBuddy.sln'
            frontend:
              - 'velora/**'
            deploy:
              - 'deploy/**'
              - 'docker-compose*.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # EventBus testleri gercek bir broker'a konusur ve broker'a ulasamadiklarinda
    # basarisiz degil SONUCSUZ sayilirlar. Bu, temiz bir checkout'u yesil tutmak
    # icin makul bir tercih; ama CI'da broker olmayinca alti testin alti da
    # atlanir ve "dotnet test" hicbir sey dogrulamadan gecer. Servis kabi, o
    # testlerin gercekten calismasini saglar.
    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      VELORA_RABBITMQ_HOST: localhost
      VELORA_RABBITMQ_PORT: '5672'
      VELORA_RABBITMQ_USER: guest
      VELORA_RABBITMQ_PASSWORD: guest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore SellingBuddy.sln
      - run: dotnet build SellingBuddy.sln -c Release --no-restore
      - name: Testler
        run: dotnet test SellingBuddy.sln -c Release --no-build --logger "console;verbosity=normal" --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18
          cache: pnpm
          cache-dependency-path: velora/pnpm-lock.yaml
      # --frozen-lockfile, lockfile ile package.json'un ayrismasini yakalar.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks tum gecmisi tarar; sig derinligi yetmez.
          fetch-depth: 0
      - name: Sizmis secret taramasi
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bagimlilik ve dosya sistemi taramasi
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
