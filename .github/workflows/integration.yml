name: Integration

on:
  push:
    branches: [main]
  schedule:
    # Her gece 02:00 UTC — gecikmeli kirilmalar (bagimlilik, imaj guncellemesi)
    # bir sonraki PR'i beklemeden gorunur olsun.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Test ortami icin .env uret
        run: |
          # Parolalar her kosuda yeniden uretilir; repoya hicbir sir girmez.
          {
            echo "AUTH_SIGNING_KEY=$(openssl rand -base64 48)"
            echo "SQL_SA_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')Aa1!"
            echo "REDIS_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')"
            echo "RABBITMQ_USER=velora"
            echo "RABBITMQ_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')"
            echo "SEED_ADMIN_EMAIL=ci-admin@velora.local"
            echo "SEED_ADMIN_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=')Aa1!"
            echo "API_PUBLIC_URL=http://localhost:5000"
            echo "MEDIA_PUBLIC_URL=http://localhost:5000/media"
            echo "STOREFRONT_ORIGIN=http://localhost:8080"
            echo "ADMIN_ORIGIN=http://localhost:8081"
            echo "SITE_NAME=Velora"
            echo "ADMIN_APP_NAME=Velora Admin"
            echo "CURRENCY=TRY"
            echo "GATEWAY_PORT=5000"
            echo "STOREFRONT_PORT=8080"
            echo "ADMIN_PORT=8081"
            echo "VELORA_TAG=ci-${GITHUB_SHA::7}"
            echo "EVENTBUS_TYPE=RabbitMQ"
            echo "EVENTBUS_CONNECTION_STRING="
            echo "PAYMENT_SUCCESS=true"
          } > .env

      # Dogrulama scriptleri parolalari ortamdan okur (artik kodda yedek yok).
      # Degerleri buradan GITHUB_ENV'e yazmak, her adimda ayni satiri tekrar
      # etmekten daha az hata uretir: yeni bir dogrulama adimi eklendiginde
      # degiskenleri tasimayi unutmak mumkun olmaz.
      - name: Dogrulama degiskenlerini adimlara yay
        run: |
          set -a && . ./.env && set +a

          # Uretilen parolalar GITHUB_ENV'e giriyor; maskelenmezse bir hata
          # ayiklama ciktisinda log'a dusebilirler.
          echo "::add-mask::${SEED_ADMIN_PASSWORD}"
          echo "::add-mask::${RABBITMQ_PASSWORD}"

          {
            echo "VELORA_GATEWAY=http://localhost:${GATEWAY_PORT}"
            echo "VELORA_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}"
            echo "VELORA_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}"
            echo "VELORA_RABBITMQ=http://localhost:15672"
            echo "VELORA_RABBITMQ_USER=${RABBITMQ_USER}"
            echo "VELORA_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Stack'i ayaga kaldir
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --build

      # Uygulama servislerinde compose healthcheck'i yok (.NET imajlarinda curl
      # bulunmuyor), bu yuzden hazir olusu disaridan yokluyoruz.
      #
      # Gateway'in /health'ini beklemek YETMEZ: gateway hicbir alt servise
      # bagli degildir ve saniyeler icinde 200 doner, oysa Catalog ve Identity
      # o sirada hala goc uygulayip seed yaziyor olabilir. Ilk kosuda tam olarak
      # bu oldu. Bu yuzden zincirin iki ucunu da yokluyoruz: katalog gercek veri
      # donene ve kimlik dogrulama token uretene kadar bekliyoruz.
      - name: Yigin gercekten hazir olana kadar bekle
        run: |
          # Basarisizligi annotation olarak da yayinlar: adim loglari depoya
          # erisim ister, annotation'lar istemez. Hangi halkanin kopdugu boylece
          # kosu ozetinden okunabiliyor.
          wait_for() {
            local name="$1" tries="$2"; shift 2
            for i in $(seq 1 "$tries"); do
              if "$@" >/dev/null 2>&1; then
                echo "$name hazir (${i}. deneme)"; return 0
              fi
              sleep 5
            done
            echo "::error title=hazirlik::${name} ${tries} denemede (>$((tries * 5)) sn) hazir olmadi"
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml ps || true
            return 1
          }

          wait_for "gateway" 60 curl -fsS "$VELORA_GATEWAY/health"
          wait_for "katalog" 90 curl -fsS "$VELORA_GATEWAY/products?pageSize=1"

          # Identity'nin seed'i bitmeden admin girisi 401 doner.
          wait_for "kimlik" 90 sh -c '
            curl -fsS -X POST "$VELORA_GATEWAY/auth/login"               -H "Content-Type: application/json"               -d "{\"userName\":\"$VELORA_ADMIN_EMAIL\",\"password\":\"$VELORA_ADMIN_PASSWORD\"}"'

      # Hangi iddianin dustugunu annotation olarak yayinlar. Adim loglari yalnizca
      # depoya erisimi olanlarca okunabilir; annotation'lar herkese acik ve
      # kosunun ozet ekraninda gorunur, yani hata log'a girmeden anlasilir.
      - name: HTTP yuzeyi dogrulamasi
        run: |
          set +e
          python scripts/verify-stack.py 2>&1 | tee stack.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "FAIL|Traceback|Error" stack.log | head -20 | while read -r line; do
              echo "::error title=verify-stack::${line}"
            done
          fi
          exit "$status"

      - name: Event bus dogrulamasi
        run: |
          set +e
          python scripts/verify-eventbus.py 2>&1 | tee bus.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "FAIL|Traceback|Error" bus.log | head -20 | while read -r line; do
              echo "::error title=verify-eventbus::${line}"
            done
          fi
          exit "$status"

      - name: Hata durumunda loglar
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml ps
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml logs --tail 200

      - name: Stack'i indir
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml down -v
