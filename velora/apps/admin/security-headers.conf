# Baseline hardening, included into every location that sets headers of its own.
#
# nginx does not merge add_header across levels: a location with its own
# add_header drops everything inherited from the server block. Repeating the set
# through an include is the only way to keep these on every response.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
