# Single-page app: every unknown path has to fall back to index.html or a
# deep link (a shared product URL, an admin route) 404s on reload.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/velora-security-headers.conf;

    # Hashed asset filenames are immutable, index.html must never be cached.
    location /assets/ {
        include /etc/nginx/velora-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/velora-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        return 200 "ok
";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
