# Single-page app: every unknown path has to fall back to index.html or a
# deep link (a shared product URL, an admin route) 404s on reload.
server {
    # 8080, cunku imaj root olmayan kullanici (nginx-unprivileged) ile calisir
    # ve 1024 altindaki portlara baglanmak icin yetki gerekir. Ayni port backend
    # servislerinde de kullaniliyor, boylece chart tek bir containerPort biliyor.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/velora-security-headers.conf;

    # Hashed asset filenames are immutable, index.html must never be cached.
    location /assets/ {
        include /etc/nginx/velora-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/velora-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Acilista uretilen calisma-ani yapilandirmasi. Kok salt-okunur oldugu icin
    # dosya /tmp'de durur; asla onbelleklenmemeli, yoksa yeni dagitimdan sonra
    # tarayici eski API adresini kullanmaya devam eder.
    location = /config.js {
        alias /tmp/config.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        default_type application/javascript;
    }

    location = /healthz {
        access_log off;
        return 200 "ok
";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
